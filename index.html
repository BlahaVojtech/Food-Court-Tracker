<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Food Court Tracker — Forum Nová Karolina Ostrava</title>
<meta name="description" content="Interaktivní mapa a záznamník navštívených restaurací a podniků ve Forum Nová Karolina v Ostravě.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="tailwind.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="bg-ink-900 text-slate-100 font-sans overflow-hidden h-screen">

<div class="flex flex-col h-screen">

  <!-- ===== HEADER ===== -->
  <header class="shrink-0 border-b border-white/10 bg-ink-800/80 backdrop-blur z-30">
    <div class="px-3 sm:px-5 py-2.5 flex items-center gap-3 flex-wrap">
      <button id="btnSidebar" class="lg:hidden p-2 rounded-lg hover:bg-white/10 transition" title="Seznam podniků">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

      <div class="flex items-center gap-2.5 mr-auto min-w-0">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-400 to-brand-600 grid place-items-center text-lg shadow-lg shadow-brand-600/25 shrink-0">🍽️</div>
        <div class="min-w-0">
          <h1 class="font-extrabold leading-tight text-[15px] sm:text-base truncate">Food Court Tracker</h1>
          <p class="text-[11px] text-slate-400 leading-tight truncate">Forum Nová Karolina · Ostrava</p>
        </div>
      </div>

      <!-- progress -->
      <div class="flex items-center gap-3 order-last w-full sm:order-none sm:w-auto sm:min-w-[240px]">
        <div class="flex-1 sm:w-40">
          <div class="flex justify-between text-[11px] mb-1">
            <span class="text-slate-400">Navštíveno</span>
            <span><b id="progCount" class="text-brand-400">0</b><span class="text-slate-500">/<span id="progTotal">0</span></span></span>
          </div>
          <div class="h-2 rounded-full bg-white/10 overflow-hidden">
            <div id="progBar" class="h-full w-0 rounded-full bg-gradient-to-r from-brand-400 to-emerald-400 transition-all duration-500"></div>
          </div>
        </div>
        <div id="progPct" class="text-sm font-bold tabular-nums text-slate-300 w-11 text-right">0 %</div>
      </div>

      <div class="flex items-center gap-1">
        <button id="btnStats" class="p-2 rounded-lg hover:bg-white/10 transition" title="Statistiky">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 19V10M10 19V5M16 19v-6M22 19H2"/></svg>
        </button>
        <button id="btnMenu" class="p-2 rounded-lg hover:bg-white/10 transition" title="Další">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== BODY ===== -->
  <div class="flex-1 flex min-h-0 relative">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="absolute lg:static inset-y-0 left-0 z-20 w-[320px] max-w-[88vw] shrink-0
           bg-ink-800 lg:bg-ink-800/60 border-r border-white/10 flex flex-col
           -translate-x-full lg:translate-x-0 transition-transform duration-300">

      <div class="p-3 space-y-2.5 border-b border-white/10">
        <div class="relative">
          <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Hledat podnik…"
                 class="w-full bg-ink-900 border border-white/10 rounded-xl pl-9 pr-3 py-2 text-sm placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500/60">
        </div>
        <div class="flex gap-1.5 text-xs">
          <button data-filter="all"      class="flt flex-1 py-1.5 rounded-lg border border-white/10 hover:bg-white/10 transition">Vše</button>
          <button data-filter="todo"     class="flt flex-1 py-1.5 rounded-lg border border-white/10 hover:bg-white/10 transition">Zbývá</button>
          <button data-filter="visited"  class="flt flex-1 py-1.5 rounded-lg border border-white/10 hover:bg-white/10 transition">Hotovo</button>
        </div>
        <div id="catChips" class="flex flex-wrap gap-1.5"></div>
      </div>

      <div id="list" class="flex-1 overflow-y-auto p-2 space-y-1.5 scroll-thin"></div>

      <div class="p-2.5 border-t border-white/10 text-[11px] text-slate-500 flex items-center justify-between">
        <span>Data uložena v prohlížeči</span>
        <button id="btnReset" class="text-rose-400 hover:text-rose-300 hover:underline">Vymazat</button>
      </div>
    </aside>

    <div id="scrim" class="lg:hidden fixed inset-0 bg-black/60 z-10 hidden"></div>

    <!-- MAP -->
    <main class="flex-1 relative min-w-0 bg-ink-900 overflow-hidden">
      <div id="mapWrap" class="absolute inset-0 cursor-grab active:cursor-grabbing touch-none select-none">
        <svg id="map" class="w-full h-full block" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,.035)" stroke-width="1"/>
            </pattern>
            <linearGradient id="gFloor" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#151d38"/><stop offset="100%" stop-color="#0d1326"/>
            </linearGradient>
            <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
              <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/>
            </filter>
          </defs>
          <g id="viewport"></g>
        </svg>
      </div>

      <!-- floor switcher -->
      <div id="floorBar" class="absolute top-3 left-1/2 -translate-x-1/2 z-10 flex gap-1 p-1 rounded-2xl bg-ink-800/90 backdrop-blur border border-white/10 shadow-xl max-w-[calc(100%-1.5rem)] overflow-x-auto scroll-thin"></div>

      <!-- zoom controls -->
      <div class="absolute right-3 bottom-3 z-10 flex flex-col gap-1.5">
        <button id="zIn"    class="zbtn" title="Přiblížit">+</button>
        <button id="zOut"   class="zbtn" title="Oddálit">−</button>
        <button id="zFit"   class="zbtn text-base" title="Zobrazit vše">⛶</button>
      </div>

      <!-- legend -->
      <div class="absolute left-3 bottom-3 z-10 rounded-xl bg-ink-800/90 backdrop-blur border border-white/10 px-3 py-2 text-[11px] space-y-1 shadow-xl hidden sm:block">
        <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-emerald-500"></span> Navštíveno</div>
        <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-red-500"></span> Zatím nenavštíveno</div>
        <div class="flex items-center gap-2"><span class="w-3 h-3 rounded" style="background:#232f52"></span> Ostatní jednotky</div>
        <div class="text-slate-500 pt-0.5">Kolečko = zoom · Táhnout = posun</div>
      </div>

      <div id="zoomLabel" class="hidden sm:block absolute right-3 top-3 z-10 px-2.5 py-1 rounded-lg bg-ink-800/90 border border-white/10 text-[11px] tabular-nums text-slate-400">100 %</div>

      <!-- kompas (sever nahoře) -->
      <div class="absolute right-3 top-12 z-10 w-11 h-11 rounded-full bg-ink-800/90 border border-white/10 grid place-items-center shadow-xl" title="Sever je nahoře">
        <svg viewBox="0 0 40 40" class="w-8 h-8">
          <path d="M20 5 L25 21 L20 18 L15 21 Z" fill="#ef4444"/>
          <path d="M20 35 L15 19 L20 22 L25 19 Z" fill="#475569"/>
          <text x="20" y="13" text-anchor="middle" font-size="8" font-weight="800" fill="#fff">S</text>
        </svg>
      </div>

      <!-- grafické měřítko -->
      <div class="absolute right-16 bottom-3 z-10 text-[10px] text-slate-400 select-none pointer-events-none hidden sm:block">
        <div class="flex items-end gap-1.5">
          <div>
            <div id="scaleLabel" class="text-right mb-0.5 tabular-nums">50 m</div>
            <div id="scaleBar" class="h-2 border-x-2 border-b-2 border-slate-400/70" style="width:70px"></div>
          </div>
        </div>
      </div>

      <!-- tooltip -->
      <div id="tip" class="pointer-events-none absolute z-20 hidden px-2.5 py-1.5 rounded-lg bg-black/85 border border-white/10 text-xs whitespace-nowrap shadow-xl"></div>
    </main>

    <!-- DETAIL PANEL -->
    <aside id="detail" class="hidden absolute lg:static right-0 inset-y-0 z-20 w-[340px] max-w-[92vw] shrink-0
           bg-ink-800 border-l border-white/10 flex-col shadow-2xl"></aside>
  </div>
</div>

<!-- ===== MODALS ===== -->
<div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
  <div id="modalBox" class="w-full max-w-lg rounded-2xl bg-ink-800 border border-white/10 shadow-2xl animate-slideup max-h-[85vh] overflow-y-auto scroll-thin"></div>
</div>

<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2.5 rounded-xl bg-emerald-500 text-slate-900 font-semibold text-sm shadow-2xl"></div>

<script src="plan.js"></script>
<script src="surround.js"></script>
<script src="extra.js"></script>
<script src="logos.js"></script>
<script src="app.js"></script>
</body>
</html>
