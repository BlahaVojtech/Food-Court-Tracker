<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Food Court Tracker — Forum Nová Karolina Ostrava</title>
<meta name="description" content="Interaktivní technická mapa a záznamník navštívených gastro podniků ve Forum Nová Karolina.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2310b981'/><path d='M30 50h40M50 30v40' stroke='%230b0d11' stroke-width='12' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tailwind.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#0b0d11] text-[#e2e4e9] font-sans overflow-hidden h-screen select-none antialiased">

<div class="flex flex-col h-screen">

  <!-- ===== HEADER ===== -->
  <header class="shrink-0 border-b border-[#20232b] bg-[#101217] z-30 px-3 sm:px-4 py-2">
    <div class="flex items-center justify-between gap-3 flex-wrap">
      
      <!-- Logo a název -->
      <div class="flex items-center gap-3">
        <button id="btnSidebar" class="lg:hidden p-1.5 rounded border border-[#262a34] hover:bg-[#1a1d24] text-[#9ca3af] transition" title="Seznam podniků">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>

        <div class="flex items-center gap-2.5">
          <div class="w-7 h-7 rounded border border-[#2a2e39] bg-[#161920] flex items-center justify-center font-mono text-xs font-semibold text-[#10b981]">
            FC
          </div>
          <div>
            <h1 class="text-xs sm:text-sm font-semibold tracking-tight text-white flex items-center gap-2 leading-none">
              FOOD COURT TRACKER
              <span class="text-[9px] font-mono text-[#6b7280] font-normal border border-[#262a34] px-1 py-0.5 rounded">FNK OSTRAVA</span>
            </h1>
          </div>
        </div>
      </div>

      <!-- Průběh návštěvnosti -->
      <div class="flex items-center gap-3 order-last w-full sm:order-none sm:w-auto">
        <div class="w-full sm:w-44 flex flex-col gap-1">
          <div class="flex justify-between items-center text-[10px] font-mono leading-none">
            <span class="text-[#848a96] uppercase tracking-wider text-[9px]">Navštíveno</span>
            <span>
              <b id="progCount" class="text-[#10b981] font-semibold">0</b>
              <span class="text-[#525866]">/</span>
              <span id="progTotal" class="text-[#848a96]">0</span>
            </span>
          </div>
          <div class="h-1.5 w-full bg-[#1b1e26] rounded-full overflow-hidden border border-[#262a34]/60">
            <div id="progBar" class="h-full w-0 bg-[#10b981] transition-all duration-300"></div>
          </div>
        </div>
        <div id="progPct" class="text-xs font-mono font-medium text-[#9ca3af] tabular-nums min-w-[3rem] text-right">0 %</div>
      </div>

      <!-- Akční tlačítka -->
      <div class="flex items-center gap-1.5">
        <button id="btnStats" class="px-2.5 py-1.5 rounded border border-[#262a34] bg-[#14161d] hover:bg-[#1c1f28] hover:border-[#383d4b] text-xs text-[#9ca3af] hover:text-white transition flex items-center gap-1.5 font-mono">
          <svg class="w-3.5 h-3.5 text-[#10b981]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 19V10M10 19V5M16 19v-6M22 19H2"/></svg>
          <span class="hidden sm:inline">DATA</span>
        </button>
        <button id="btnMenu" class="p-1.5 rounded border border-[#262a34] bg-[#14161d] hover:bg-[#1c1f28] hover:border-[#383d4b] text-[#9ca3af] hover:text-white transition" title="Nastavení a správa">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
        </button>
      </div>

    </div>
  </header>

  <!-- ===== HLAVNÍ PLOCHA ===== -->
  <div class="flex-1 flex min-h-0 relative">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="absolute lg:static inset-y-0 left-0 z-20 w-[330px] max-w-[88vw] shrink-0
           bg-[#101217] border-r border-[#20232b] flex flex-col
           -translate-x-full lg:translate-x-0 transition-transform duration-200">

      <div class="p-3 border-b border-[#20232b] flex flex-col gap-2">
        <div class="relative">
          <svg class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-[#5e6573]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Hledat jednotku nebo název…"
                 class="w-full bg-[#14171e] border border-[#242832] rounded px-3 py-1.5 pl-8 text-xs text-[#e2e4e9] placeholder:text-[#5e6573] focus:outline-none focus:border-[#10b981] transition font-sans">
        </div>

        <!-- Přepínač stavu -->
        <div class="grid grid-cols-3 gap-1 p-0.5 rounded bg-[#14171e] border border-[#22252e]">
          <button data-filter="all"     class="flt py-1 text-center rounded text-[11px] font-medium text-[#848a96] hover:text-white transition">Vše</button>
          <button data-filter="todo"    class="flt py-1 text-center rounded text-[11px] font-medium text-[#848a96] hover:text-white transition">Zbývá</button>
          <button data-filter="visited" class="flt py-1 text-center rounded text-[11px] font-medium text-[#848a96] hover:text-white transition">Hotovo</button>
        </div>

        <div id="catChips" class="flex flex-wrap gap-1 max-h-20 overflow-y-auto scroll-thin pt-0.5"></div>
      </div>

      <!-- Seznam provozoven -->
      <div id="list" class="flex-1 overflow-y-auto p-2 space-y-1 scroll-thin"></div>

      <div class="px-3 py-2 border-t border-[#20232b] bg-[#0d0e13] text-[10px] font-mono text-[#6b7280] flex items-center justify-between">
        <span id="storageStatus" class="truncate mr-2">Připojování…</span>
        <button id="btnReset" class="hover:text-rose-400 uppercase tracking-wider text-[9px] transition">Reset</button>
      </div>
    </aside>

    <div id="scrim" class="lg:hidden fixed inset-0 bg-black/60 z-10 hidden backdrop-blur-[2px]"></div>

    <!-- MAPA (PŮVODNÍ INTERAKTIVNÍ SVGVÝŘEZ) -->
    <main class="flex-1 relative min-w-0 bg-[#090b0e] overflow-hidden">
      <div id="mapWrap" class="absolute inset-0 cursor-grab active:cursor-grabbing touch-none select-none">
        <svg id="map" class="w-full h-full block" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,.025)" stroke-width="1"/>
            </pattern>
            <linearGradient id="gFloor" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#151d38"/><stop offset="100%" stop-color="#0d1326"/>
            </linearGradient>
            <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
              <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/>
            </filter>
          </defs>
          <g id="viewport"></g>
        </svg>
      </div>

      <!-- Přepínač pater -->
      <div id="floorBar" class="absolute top-3 left-1/2 -translate-x-1/2 z-10 flex gap-1 p-0.5 rounded-lg bg-[#11131a]/95 backdrop-blur border border-[#252833] shadow-lg max-w-[calc(100%-2rem)] overflow-x-auto scroll-thin"></div>

      <!-- Zoom ovládání -->
      <div class="absolute right-3 bottom-3 z-10 flex flex-col gap-1">
        <button id="zIn"  class="zbtn" title="Přiblížit">+</button>
        <button id="zOut" class="zbtn" title="Oddálit">−</button>
        <button id="zFit" class="zbtn font-mono text-xs" title="Zobrazit vše">FIT</button>
      </div>

      <!-- Legenda mapy -->
      <div class="absolute left-3 bottom-3 z-10 rounded-md bg-[#101218]/90 backdrop-blur border border-[#22252f] px-2.5 py-1.5 text-[10px] font-mono space-y-1 shadow-md hidden sm:block">
        <div class="flex items-center gap-2 text-[#9ca3af]"><span class="w-2.5 h-2.5 rounded bg-[#10b981]"></span> Navštíveno</div>
        <div class="flex items-center gap-2 text-[#9ca3af]"><span class="w-2.5 h-2.5 rounded bg-[#ef4444]"></span> K návštěvě</div>
        <div class="flex items-center gap-2 text-[#9ca3af]"><span class="w-2.5 h-2.5 rounded" style="background:#232f52"></span> Ostatní jednotky</div>
        <div class="text-[#525866] pt-0.5 border-t border-[#1d2029]">Kolečko = zoom · Táhnout = posun</div>
      </div>

      <div id="zoomLabel" class="hidden sm:block absolute right-3 top-3 z-10 px-2 py-0.5 rounded bg-[#101218]/90 border border-[#22252f] text-[10px] font-mono text-[#848a96]">100 %</div>

      <!-- Kompas -->
      <div class="absolute right-3 top-10 z-10 w-8 h-8 rounded bg-[#101218]/90 border border-[#22252f] grid place-items-center shadow" title="Sever je nahoře">
        <div class="font-mono text-[10px] font-bold text-[#ef4444]">N</div>
      </div>

      <!-- Měřítko -->
      <div class="absolute right-14 bottom-3 z-10 text-[9px] font-mono text-[#525866] pointer-events-none hidden sm:block">
        <div id="scaleLabel" class="text-right mb-0.5 tabular-nums">50 m</div>
        <div id="scaleBar" class="h-1.5 border-x-2 border-b-2 border-[#525866]" style="width:70px"></div>
      </div>

      <!-- Tooltip -->
      <div id="tip" class="pointer-events-none absolute z-20 hidden px-2.5 py-1.5 rounded bg-[#0b0c10]/95 border border-[#252833] text-xs shadow-xl"></div>
    </main>

    <!-- DETAILNÍ BOČNÍ PANEL -->
    <aside id="detail" class="hidden absolute lg:static right-0 inset-y-0 z-20 w-[330px] max-w-[92vw] shrink-0
           bg-[#101217] border-l border-[#20232b] flex-col shadow-2xl"></aside>

  </div>
</div>

<!-- ===== MODÁL ===== -->
<div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center p-3 sm:p-4 bg-black/75 backdrop-blur-sm">
  <div id="modalBox" class="w-full max-w-md rounded-lg bg-[#111319] border border-[#262a35] shadow-2xl animate-slideup max-h-[88vh] overflow-y-auto scroll-thin"></div>
</div>

<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 hidden px-3.5 py-1.5 rounded bg-[#10b981] text-[#081510] font-mono text-xs font-semibold shadow-xl"></div>

<script src="plan.js"></script>
<script src="surround.js"></script>
<script src="extra.js"></script>
<script src="logos.js"></script>
<script src="app.js"></script>
</body>
</html>
